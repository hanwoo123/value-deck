name: Value update tests
on:
  push:
    paths: ['tools/update_values.py', 'tools/update_comparisons.py', 'tools/comparison-sources.json', 'tests/test_comparisons.py', 'tools/update_ctd_references.py', 'tools/ctd-reference-source.json', 'tests/test_ctd_references.py', '.github/workflows/update-comparisons.yml', 'tools/public_sources.py', 'tools/value-sources.json', 'tests/test_update_values.py', 'tests/test_reference_values.py', 'tools/set_reference_values.py', 'data/reference-rules.json', '.github/workflows/value-tests.yml']
  pull_request:
    paths: ['tools/update_values.py', 'tools/update_comparisons.py', 'tools/comparison-sources.json', 'tests/test_comparisons.py', 'tools/update_ctd_references.py', 'tools/ctd-reference-source.json', 'tests/test_ctd_references.py', '.github/workflows/update-comparisons.yml', 'tools/public_sources.py', 'tools/value-sources.json', 'tests/test_update_values.py', 'tests/test_reference_values.py', 'tools/set_reference_values.py', 'data/reference-rules.json', '.github/workflows/value-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

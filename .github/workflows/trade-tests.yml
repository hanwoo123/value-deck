name: Trade board tests
on:
  push:
    paths: ['server/**', 'tests/trades.test.mjs', 'js/trades.js', 'Dockerfile', '.github/workflows/trade-tests.yml']
  pull_request:
    paths: ['server/**', 'tests/trades.test.mjs', 'js/trades.js', 'Dockerfile', '.github/workflows/trade-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/trades.test.mjs
      - run: node --check js/trades.js

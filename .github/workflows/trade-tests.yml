name: Trade board tests
on:
  push:
    paths: ['supabase/**', 'tests/supabase-*.test.mjs', 'tests/discord-*.test.mjs', 'js/trade*.js', 'package*.json', 'tools/build-discord.mjs', '.github/workflows/trade-tests.yml']
  pull_request:
    paths: ['supabase/**', 'tests/supabase-*.test.mjs', 'tests/discord-*.test.mjs', 'js/trade*.js', 'package*.json', 'tools/build-discord.mjs', '.github/workflows/trade-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node --check js/trades.js && node --check js/trade-store.js && node --check js/trade-chat.js && node --check js/trade-picker.js

name: Update public comparisons
on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: value-deck-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test update rules
        run: python -m unittest discover -s tests -v
      - name: Check terms and robots, then compare public numeric quotes
        id: collect
        continue-on-error: true
        run: python tools/update_comparisons.py --write
      - name: Commit changed values and history
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add data/blox-fruits.json data/cameraman-td.json
          if [ -f data/value-update-status.json ]; then git add data/value-update-status.json; fi
          if [ -f data/value-history.json ]; then git add data/value-history.json; fi
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public numeric price comparisons'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN commits do not trigger a separate Pages workflow/build.
      # Deploy explicitly after a successful update.
      - name: Prepare public site artifact
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/value-deck-site
          cp index.html CNAME .nojekyll /tmp/value-deck-site/
          cp -R css js data images /tmp/value-deck-site/
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: /tmp/value-deck-site
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true'
      - name: Report insufficient source coverage
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo 'Some games could not be verified. See data/value-update-status.json for source diagnostics.'
          exit 1
